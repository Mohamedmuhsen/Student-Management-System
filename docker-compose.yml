version: "3.9"

services:

  # ── FastAPI Application ───────────────────────────────────────────────
  app:
    build: .
    container_name: student_management_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./student_management.db
      - SECRET_KEY=change-this-to-a-strong-secret-key
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./logs:/app/logs
      - ./student_management.db:/app/student_management.db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ── Redis Cache ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: student_management_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
